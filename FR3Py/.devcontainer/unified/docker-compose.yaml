version: "3.9"
services:
  fr3py_sharpa:
    build:
      context: ../..
      dockerfile: .devcontainer/unified/Dockerfile
      args:
        SHARPA_IMAGE: ${SHARPA_IMAGE:-sharpadev/sharpawavesdk:5.0.2.7f0e}
        INSTALL_SHARPA_SDK: "1"
    container_name: fr3py-sharpa-container
    network_mode: host
    privileged: true
    command: bash
    stdin_open: true
    tty: true
    runtime: nvidia
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../../:/home/FR3Py
      - /home/jason/docker.xauth:/tmp/.docker.xauth:ro
    environment:
      - DISPLAY=localhost:12.0
      - XAUTHORITY=/tmp/.docker.xauth
      - QT_X11_NO_MITSHM=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
